name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Stamp version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ inputs.version }}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Version must follow semantic versioning (e.g., 1.0.0)"
            exit 1
          fi
          CURRENT=$(gh release list --json tagName -q '.[].tagName' | sort -V | tail -n1)
          HIGHEST=$(printf '%s\n%s' "$CURRENT" "$VERSION" | sort -V | tail -n1)
          echo "is_latest=$([[ "$HIGHEST" = "$VERSION" ]] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo -n "$VERSION" > pkg/.version

      - uses: jdx/mise-action@v3
        with:
          version: 2025.11.11
          install: true

      - name: Build sayt binary
        env:
          SAYT_BUILD_VERSION: ${{ inputs.version }}
        run: |
          mise run build

      - name: Zip package
        run: |
          cd pkg && zip -r ../sayt-${{ inputs.version }}.zip .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.is_latest }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          files: |
            sayt-${{ inputs.version }}.zip
            pkg/bin/sayt.com
            saytw
            saytw.ps1
          generate_release_notes: true
          make_latest: ${{ steps.version.outputs.is_latest }}
